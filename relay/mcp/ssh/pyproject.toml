[project]
name = "mcp-ssh-terminal"
version = "0.1.0"
description = "MCP server providing SSH terminal access for Claude"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "paramiko>=3.0.0",
]

[project.scripts]
mcp-ssh-terminal = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
