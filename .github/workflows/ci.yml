name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  # scan_js deleted 2026-11-13. The job ran `bin/importmap audit`, which does not
  # exist: no `bin/importmap` binstub, no `config/importmap.rb`, no `package.json`,
  # and therefore zero pins. There is no JavaScript dependency surface in this app
  # for the audit to read, so the step could only ever exit 127.
  #
  # This is not a security scan judged unnecessary. It is a scan of a surface that
  # is not there. The related live defect - `app/views/layouts/application.html.erb:9`
  # calls `javascript_importmap_tags` while `importmap-rails` is declared at
  # Gemfile:11 and never installed - is recorded as a row. If an importmap is ever
  # wired, this job comes back with it.

  test:
    runs-on: ubuntu-latest

    # services:
    #  redis:
    #    image: valkey/valkey:8
    #    ports:
    #      - 6379:6379
    #    options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Compile every ERB template
        run: |
          fail=0
          while IFS= read -r f; do
            if ! erb -x -T - "$f" > /dev/null 2>/tmp/erb.err; then
              echo "::error file=$f::ERB does not compile"
              sed -n '1,6p' /tmp/erb.err
              fail=1
            fi
          done < <(git ls-files '*.erb')
          if [ "$fail" -ne 0 ]; then
            echo "One or more templates cannot compile. A green test suite over an"
            echo "uncompilable view is a green tick over a broken page."
            exit 1
          fi
          echo "all ERB templates compile"

      - name: Run tests
        env:
          RAILS_ENV: test
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails test

  system-test:
    runs-on: ubuntu-latest

    # services:
    #  redis:
    #    image: valkey/valkey:8
    #    ports:
    #      - 6379:6379
    #    options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run System Tests
        env:
          RAILS_ENV: test
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
