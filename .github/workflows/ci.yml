name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  # scan_js deleted 2026-11-13. The job ran `bin/importmap audit`, which does not
  # exist: no `bin/importmap` binstub, no `config/importmap.rb`, no `package.json`,
  # and therefore zero pins. There is no JavaScript dependency surface in this app
  # for the audit to read, so the step could only ever exit 127.
  #
  # This is not a security scan judged unnecessary. It is a scan of a surface that
  # is not there. The related live defect - `app/views/layouts/application.html.erb:9`
  # calls `javascript_importmap_tags` while `importmap-rails` is declared at
  # Gemfile:11 and never installed - is recorded as a row. If an importmap is ever
  # wired, this job comes back with it.

  test:
    runs-on: ubuntu-latest

    # services:
    #  redis:
    #    image: valkey/valkey:8
    #    ports:
    #      - 6379:6379
    #    options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        # -v: the assertion arithmetic on this line cannot be closed from counts
        # alone. Named rows let a reader match the summary line to the source, one
        # row at a time; a bare count cannot be audited by anybody, and a count
        # nobody can audit is a tick with no number.
        run: bin/rails test -v

      # §7.4: the boot wiring, which no test row can reach (see the script header).
      # Three bounded boots; a kill is reported, not hidden.
      - name: The boot warns, measured by booting
        env:
          RAILS_ENV: test
        run: script/probe-boot-operator-contract.sh

  system-test:
    runs-on: ubuntu-latest

    # services:
    #  redis:
    #    image: valkey/valkey:8
    #    ports:
    #      - 6379:6379
    #    options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run System Tests
        env:
          RAILS_ENV: test
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
