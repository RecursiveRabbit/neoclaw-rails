# NeoClaw service definitions.
# Format: name  wg_ip  wg_port  [service_port]
#
# wg_port:      WireGuard listen port on the host.
# service_port: The actual TCP port the service runs on (optional).
#               If present and the service binds localhost, init.sh creates
#               a DNAT rule: wg_ip:service_port → 127.0.0.1:service_port.
#               Services already on 0.0.0.0 don't need this.
#
# The manager service is special — it gets peered on every other interface.

